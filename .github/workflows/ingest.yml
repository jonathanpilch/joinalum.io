# Hourly: pull every board, commit data/ if anything changed. Each commit
# rebuilds the site on Cloudflare (Workers Builds, ~20-40s a build).
# fantastic.jobs (target employers we can't pull directly) is off: the trial
# ended in October 2026 and the key returns 401. To bring it back on a paid
# plan, restore a schedule and a step running `node ingest/fantastic.mjs`.
# Every run: radar and reminder emails (ingest/notify.mjs).
# Weekly: VT's placement report and the target list built from it.
name: ingest
on:
  schedule:
    - cron: "7 * * * *"
    # VT's placement report changes once a year; Mondays is plenty.
    - cron: "37 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: github.event.schedule == '37 9 * * 1' || github.event_name == 'workflow_dispatch'
        run: node ingest/placements.mjs && node ingest/targets.mjs
      - run: node ingest/run.mjs
      - name: Commit data
        run: |
          git config user.name "alum-ingest"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(node -e "const d=require('./data/jobs.json');console.log(d.jobs.length+' roles')")" && git push
      # Radar alerts and tracker reminders. After the commit, so a mail
      # problem never holds up the data; skips itself without the secrets.
      - name: Email radars and reminders
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALUM_FROM: ${{ vars.ALUM_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node ingest/notify.mjs
