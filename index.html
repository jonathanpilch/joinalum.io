<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Alum</title>
    <meta name="description" content="Fresh internships and early career roles at the companies your school's alumni already work at." />
    <meta name="theme-color" content="#16171b" />
    <link rel="icon" type="image/svg+xml" href="assets/brand/nu-mark.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Alum home">
        <img class="brand-mark" src="assets/brand/nu-mark.svg" alt="" />
        <span class="brand-name">alum</span>
      </a>
      <span class="school-chip" id="school-chip">
        <img id="school-mark" alt="" />
        <span id="school-name"></span>
      </span>
      <span class="spacer"></span>
      <span class="updated" id="updated"></span>
    </header>

    <main class="main">
      <section class="hero">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 id="hero-title"></h1>
        <p class="lede" id="hero-lede"></p>
        <a class="btn" href="#board">Browse roles</a>
        <p class="proof" id="hero-proof"></p>
      </section>

      <section class="board" id="board">
        <div class="searchbar glass-card">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <input id="q" type="search" placeholder="Search roles, companies, cities" autocomplete="off" />
          </label>
          <div class="chips" id="chips">
            <button class="btn soft sm filter-btn" id="open-filters">
              <span class="count" id="filter-count" hidden></span>
              Edit filters
            </button>
            <span class="divider"></span>
            <span id="active-chips" class="chips"></span>
          </div>
        </div>

        <p class="tally" id="tally"></p>

        <div class="table glass-card" role="table" aria-label="Roles">
          <div class="row head" role="row">
            <span role="columnheader">Role</span>
            <span role="columnheader">Location</span>
            <span role="columnheader">Posted</span>
            <span role="columnheader">Pay</span>
            <span role="columnheader">Level</span>
            <span role="columnheader" class="right">Apply</span>
          </div>
          <div id="rows"></div>
          <div class="empty" id="empty" hidden>
            <p>No roles match these filters.</p>
            <button class="btn soft sm" id="reset-empty">Reset filters</button>
          </div>
        </div>
        <div class="more"><button class="btn soft" id="more">Load more roles</button></div>
      </section>

      <footer class="foot">
        <span>alum · a <strong>nublock</strong> product, alongside Ndex</span>
        <span id="foot-note"></span>
      </footer>
    </main>

    <!-- Filters drawer -->
    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="filters" aria-label="Filters" hidden>
      <header class="drawer-head">
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
        <h2>Filters</h2>
        <span class="spacer"></span>
        <button class="btn soft sm" id="reset">Reset</button>
        <button class="btn sm" id="apply">Show roles</button>
      </header>
      <div class="drawer-body" id="filter-body"></div>
    </aside>

    <!-- Role detail -->
    <aside class="drawer wide" id="detail" aria-label="Role" hidden>
      <header class="drawer-head">
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
        <span class="spacer"></span>
        <a class="btn sm" id="detail-apply" href="#" target="_blank" rel="noopener">Apply
          <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" /></svg>
        </a>
      </header>
      <div class="drawer-body" id="detail-body"></div>
    </aside>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="schools.js"></script>
    <script src="app.js"></script>
  </body>
</html>
